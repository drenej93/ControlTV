<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Remote Studio</title>
  <style>
    :root {
      --bg-color: #12141c;
      --remote-bg: #1a1d28;
      --primary: #ff4757;
      --btn-bg: #262b3c;
      --btn-active: #3a4158;
      --text-color: #ffffff;
      --text-muted: #8b92a5;
      --accent-glow: rgba(255, 71, 87, 0.3);
      --border-radius: 20px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      padding-bottom: 70px;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Botón de encendido corregido con SVG limpio */
    .power-btn {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
      cursor: pointer;
      margin-bottom: 20px;
    }

    .connect-banner {
      width: 100%;
      padding: 12px;
      background: var(--remote-bg);
      border: 1px solid #2a2e3d;
      border-radius: 12px;
      color: var(--text-color);
      text-align: center;
      margin-bottom: 15px;
      cursor: pointer;
      font-size: 14px;
    }

    /* Barra inferior fija para que no se corte */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background-color: var(--remote-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #2a2e3d;
      z-index: 1000;
    }

    .bottom-nav button {
      background: none;
      border: none;
      font-size: 22px;
      cursor: pointer;
      opacity: 0.5;
      padding: 10px;
    }

    .bottom-nav button.active {
      opacity: 1;
      filter: drop-shadow(0 0 6px var(--primary));
    }

    .device-list {
      width: 100%;
      margin-top: 15px;
    }

    .device-item {
      background: var(--remote-bg);
      padding: 12px 15px;
      border-radius: 10px;
      margin-bottom: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
      border: 1px solid #2a2e3d;
    }

    .device-item:hover {
      background: var(--btn-active);
    }

    .scan-btn {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 12px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app">
    <!-- El contenido se renderizará aquí -->
  </div>

  <script>
    let activeTab = 'remote';
    let isConnected = false;
    let connectedTV = 'Ninguna TV seleccionada';
    let devices = [];
    let scanning = false;

    function render() {
      const app = document.getElementById('app');
      
      let screenContent = '';

      if (activeTab === 'remote') {
        screenContent = `
          <div class="screen">
            <button class="power-btn" onclick="alert('Señal de Encendido (Power) enviada')">
              <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                <line x1="12" y1="2" x2="12" y2="12"></line>
              </svg>
            </button>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px;">Estado: ${connectedTV}</p>
            <div style="display: flex; gap: 10px; width: 100%; justify-content: center; margin-bottom: 20px;">
              <button style="flex:1; padding:12px; background:var(--btn-bg); border:none; border-radius:12px; color:white;">TV</button>
              <button style="flex:1; padding:12px; background:var(--btn-bg); border:none; border-radius:12px; color:white;">Home</button>
              <button style="flex:1; padding:12px; background:var(--btn-bg); border:none; border-radius:12px; color:white;">Apps</button>
            </div>
          </div>
        `;
      } else if (activeTab === 'numberpad') {
        screenContent = `
          <div class="screen">
            <button class="connect-banner" onclick="activeTab='settings'; render();">
              🔴 ${isConnected ? `Conectado a: ${connectedTV}` : '🔍 Toca aquí para buscar TVs en la Red Wi-Fi'}
            </button>
            <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 300px; margin-top: 20px;">
              ${[1,2,3,4,5,6,7,8,9].map(n => `<button style="padding: 20px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer;" onclick="alert('Número ${n}')">${n}</button>`).join('')}
              <button style="padding: 20px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer;" onclick="alert('Borrar')">⌫</button>
              <button style="padding: 20px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer;" onclick="alert('0')">0</button>
              <button style="padding: 20px; background: #2ed573; border: none; border-radius: 50%; color: white; font-size: 14px; font-weight: bold; cursor: pointer;" onclick="alert('Enter')">OK</button>
            </div>
          </div>
        `;
      } else if (activeTab === 'settings') {
        screenContent = `
          <div class="screen">
            <h3 style="margin-bottom: 10px;">Configuración de Red</h3>
            <p style="color: var(--text-muted); font-size: 13px; margin-bottom: 20px; text-align: center;">Busca cualquier Android TV o Google TV conectado a tu Wi-Fi.</p>
            
            <button class="scan-btn" onclick="scanNetwork()">
              ${scanning ? 'Buscando dispositivos...' : 'Escanear Red Wi-Fi'}
            </button>

            <div class="device-list">
              ${devices.length === 0 ? '<p style="text-align:center; color:var(--text-muted); margin-top:20px;">No hay dispositivos en pantalla. Pulsa escanear.</p>' : ''}
              ${devices.map(d => `
                <div class="device-item" onclick="connectToDevice('${d.name}', '${d.ip}')">
                  <span>📺 ${d.name}</span>
                  <small style="color: var(--text-muted);">${d.ip}</small>
                </div>
              `).join('')}
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        ${screenContent}
        <nav class="bottom-nav">
          <button class="${activeTab === 'remote' ? 'active' : ''}" onclick="activeTab='remote'; render();">🏠</button>
          <button class="${activeTab === 'numberpad' ? 'active' : ''}" onclick="activeTab='numberpad'; render();">🔢</button>
          <button class="${activeTab === 'settings' ? 'active' : ''}" onclick="activeTab='settings'; render();">⚙️</button>
        </nav>
      `;
    }

    function scanNetwork() {
      scanning = true;
      render();
      setTimeout(() => {
        // Lista simulada abierta para cualquier marca de Smart TV en la red local
        devices = [
          { name: 'Google TV (Sala)', ip: '192.168.1.50' },
          { name: 'Android TV Genérico', ip: '192.168.1.102' },
          { name: 'Caixun Smart TV', ip: '192.168.1.115' }
        ];
        scanning = false;
        render();
      }, 1500);
    }

    function connectToDevice(name, ip) {
      isConnected = true;
      connectedTV = `${name} (${ip})`;
      alert(`¡Conectado exitosamente a ${name}!`);
      activeTab = 'remote';
      render();
    }

    render();
  </script>
</body>
</html>
