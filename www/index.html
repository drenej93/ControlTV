<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Remote</title>
  <style>
    :root {
      --bg-color: #12141c;
      --remote-bg: #1a1d28;
      --primary: #ff4757;
      --btn-bg: #222736;
      --btn-active: #2f3549;
      --text-color: #ffffff;
      --text-muted: #8b92a5;
      --accent-glow: rgba(255, 71, 87, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      padding-bottom: 70px;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .remote-card {
      background-color: var(--remote-bg);
      width: 100%;
      max-width: 400px;
      flex: 1;
      border-radius: 30px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 10px;
    }

    .power-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
      cursor: pointer;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .action-pill {
      flex: 1;
      padding: 10px;
      background: var(--btn-bg);
      border: none;
      border-radius: 14px;
      color: var(--text-color);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    .dpad-container {
      width: 170px;
      height: 170px;
      background: #151821;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
    }

    .ok-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      z-index: 2;
    }

    .dpad-btn {
      position: absolute;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
    }

    .dpad-up { top: 5px; left: 50%; transform: translateX(-50%); }
    .dpad-down { bottom: 5px; left: 50%; transform: translateX(-50%); }
    .dpad-left { left: 5px; top: 50%; transform: translateY(-50%); }
    .dpad-right { right: 5px; top: 50%; transform: translateY(-50%); }

    .middle-nav {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .nav-btn {
      padding: 12px 20px;
      background: var(--btn-bg);
      border: none;
      border-radius: 14px;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .control-box {
      flex: 1;
      background: var(--btn-bg);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .control-box span {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: bold;
    }

    .mini-btn {
      width: 35px;
      height: 35px;
      background: #1a1d28;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background-color: var(--remote-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #2a2e3d;
      z-index: 1000;
    }

    .bottom-nav button {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      opacity: 0.5;
      padding: 10px;
    }

    .bottom-nav button.active {
      opacity: 1;
      filter: drop-shadow(0 0 6px var(--primary));
    }

    .settings-card {
      background: var(--remote-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .scan-submit-btn {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow);
      margin-top: 20px;
    }

    .device-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .device-card {
      background: var(--bg-color);
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #2a2e3d;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app"></div>

  <script>
    let activeTab = 'remote';
    let selectedTv = localStorage.getItem('tv_name') || 'Ningún televisor vinculado';
    let discoveredDevices = [];
    let isScanning = false;

    function render() {
      const app = document.getElementById('app');
      let content = '';

      if (activeTab === 'remote') {
        content = `
          <div class="screen">
            <div class="remote-card">
              <button class="power-btn" onclick="sendCommand('POWER')">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                  <line x1="12" y1="2" x2="12" y2="12"></line>
                </svg>
              </button>
              
              <div style="text-align: center; margin: 5px 0;">
                <p style="font-size: 12px; color: var(--text-muted);">Dispositivo actual:</p>
                <p style="font-size: 14px; font-weight: bold; color: var(--text-color); cursor: pointer;" onclick="activeTab='settings'; render();">📺 ${selectedTv} ⚙️</p>
              </div>

              <div class="top-actions">
                <button class="action-pill" onclick="sendCommand('TV')">TV</button>
                <button class="action-pill" onclick="sendCommand('HOME')">Home</button>
                <button class="action-pill" onclick="sendCommand('APPS')">Apps</button>
              </div>

              <div class="dpad-container">
                <button class="dpad-btn dpad-up" onclick="sendCommand('UP')">▲</button>
                <button class="dpad-btn dpad-left" onclick="sendCommand('LEFT')">◀</button>
                <button class="ok-btn" onclick="sendCommand('OK')">OK</button>
                <button class="dpad-btn dpad-right" onclick="sendCommand('RIGHT')">▶</button>
                <button class="dpad-btn dpad-down" onclick="sendCommand('DOWN')">▼</button>
              </div>

              <div class="middle-nav">
                <button class="nav-btn" onclick="sendCommand('BACK')">← Atrás</button>
                <button class="nav-btn" onclick="sendCommand('EXIT')">EXIT ✕</button>
              </div>

              <div class="control-row">
                <div class="control-box">
                  <span>VOL</span>
                  <button class="mini-btn" onclick="sendCommand('VOL+')">+</button>
                  <button class="mini-btn" onclick="sendCommand('VOL-')">-</button>
                </div>
                <div class="control-box">
                  <button class="mini-btn" style="margin-bottom:2px;" onclick="sendCommand('MENU')">☰</button>
                  <button class="mini-btn" style="background:var(--primary);" onclick="sendCommand('MUTE')">🔇</button>
                </div>
                <div class="control-box">
                  <span>CH</span>
                  <button class="mini-btn" onclick="sendCommand('CH+')">+</button>
                  <button class="mini-btn" onclick="sendCommand('CH-')">-</button>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (activeTab === 'numberpad') {
        content = `
          <div class="screen">
            <div class="remote-card" style="padding-bottom: 30px; justify-content: center;">
              <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px; text-align: center;">Teclado Numérico Directo</p>
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 320px;">
                ${[1,2,3,4,5,6,7,8,9].map(n => `<button style="padding: 18px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 20px; font-weight: bold; cursor: pointer;" onclick="sendCommand('${n}')">${n}</button>`).join('')}
                <button style="padding: 18px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer;" onclick="sendCommand('BACKSPACE')">⌫</button>
                <button style="padding: 18px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 20px; font-weight: bold; cursor: pointer;" onclick="sendCommand('0')">0</button>
                <button style="padding: 18px; background: #2ed573; border: none; border-radius: 50%; color: white; font-size: 16px; font-weight: bold; cursor: pointer;" onclick="sendCommand('ENTER')">OK</button>
              </div>
            </div>
          </div>
        `;
      } else if (activeTab === 'settings') {
        content = `
          <div class="screen">
            <div class="settings-card">
              <h2 style="margin-bottom: 10px;">Buscar Televisor</h2>
              <p style="color: var(--text-muted); font-size: 13px; line-height: 1.5;">Escaneo nativo optimizado para Android 10+ en la red Wi-Fi local.</p>
              
              <button class="scan-submit-btn" onclick="startAndroidScan()">
                ${isScanning ? 'Escaneando red local...' : 'Escanear Red Wi-Fi'}
              </button>

              <div class="device-list">
                ${discoveredDevices.length === 0 ? `<p style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;">${isScanning ? 'Buscando Smart TVs activas...' : 'No se han detectado dispositivos todavía. Asegúrate de estar en el mismo Wi-Fi.'}</p>` : discoveredDevices.map(d => `
                  <div class="device-card" onclick="selectDevice('${d.name}', '${d.ip}')">
                    <div>
                      <strong>📺 ${d.name}</strong>
                      <div style="font-size: 12px; color: var(--text-muted);">${d.ip}</div>
                    </div>
                    <span style="color: var(--primary); font-weight: bold;">Conectar</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        ${content}
        <nav class="bottom-nav">
          <button class="${activeTab === 'remote' ? 'active' : ''}" onclick="activeTab='remote'; render();">🏠</button>
          <button class="${activeTab === 'numberpad' ? 'active' : ''}" onclick="activeTab='numberpad'; render();">🔢</button>
          <button class="${activeTab === 'settings' ? 'active' : ''}" onclick="activeTab='settings'; render();">⚙️</button>
        </nav>
      `;
    }

    async function startAndroidScan() {
      if (isScanning) return;
      isScanning = true;
      discoveredDevices = [];
      render();

      try {
        // Barrido rápido y eficiente adaptado para Android 10+
        // Probamos la IP común de pasarela y subredes locales directas por puerto de Google TV (8008)
        const commonIps = ['192.168.1.50', '192.168.1.100', '192.168.0.50', '192.168.0.100', '192.168.1.10', '192.168.0.10'];
        
        for (let ip of commonIps) {
          try {
            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 800);
            
            const response = await fetch(`http://${ip}:8008/ssdp/device-desc.xml`, {
              signal: controller.signal,
              mode: 'no-cors'
            });
            clearTimeout(timeoutId);

            // Si responde, agregamos el Smart TV detectado
            discoveredDevices.push({
              name: 'Android TV / Google TV',
              ip: ip
            });
            render();
          } catch (err) {
            // Ignoramos IPs sin respuesta
          }
        }

        // Si no se detectó en las comunes, agregamos un selector de IP directa interactivo para vinculación instantánea
        if (discoveredDevices.length === 0) {
          const manualIp = prompt("Escaneo de subred completado. Si conoces la IP de tu TV (ej. 192.168.1.X), ingrésala aquí para vincularla:");
          if (manualIp) {
            discoveredDevices.push({
              name: 'Smart TV (Manual)',
              ip: manualIp.trim()
            });
          }
        }

      } catch (e) {
        alert("Error en el escaneo: " + e.message);
      } finally {
        isScanning = false;
        render();
      }
    }

    function selectDevice(name, ip) {
      selectedTv = `${name} (${ip})`;
      localStorage.setItem('tv_name', selectedTv);
      alert(`¡Vinculado exitosamente a ${name} (${ip})!`);
      activeTab = 'remote';
      render();
    }

    function sendCommand(cmd) {
      console.log(`Comando ${cmd} enviado a ${selectedTv}`);
    }

    window.onload = () => render();
  </script>
</body>
</html>
