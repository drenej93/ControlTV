<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart TV Remote</title>
  <style>
    :root {
      --bg-color: #12141c;
      --remote-bg: #1a1d28;
      --primary: #ff4757;
      --btn-bg: #222736;
      --btn-active: #2f3549;
      --text-color: #ffffff;
      --text-muted: #8b92a5;
      --accent-glow: rgba(255, 71, 87, 0.3);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-color);
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      justify-content: space-between;
      padding-bottom: 70px;
    }

    .screen {
      flex: 1;
      overflow-y: auto;
      padding: 15px;
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    .remote-card {
      background-color: var(--remote-bg);
      width: 100%;
      max-width: 400px;
      flex: 1;
      border-radius: 30px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.05);
      margin-bottom: 10px;
    }

    .power-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--primary);
      border: none;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 15px var(--accent-glow);
      cursor: pointer;
    }

    .top-actions {
      display: flex;
      gap: 10px;
      width: 100%;
    }

    .action-pill {
      flex: 1;
      padding: 10px;
      background: var(--btn-bg);
      border: none;
      border-radius: 14px;
      color: var(--text-color);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-align: center;
    }

    .dpad-container {
      width: 170px;
      height: 170px;
      background: #151821;
      border-radius: 50%;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.6);
    }

    .ok-btn {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: var(--btn-bg);
      border: none;
      color: white;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      z-index: 2;
    }

    .dpad-btn {
      position: absolute;
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px;
      height: 40px;
    }

    .dpad-up { top: 5px; left: 50%; transform: translateX(-50%); }
    .dpad-down { bottom: 5px; left: 50%; transform: translateX(-50%); }
    .dpad-left { left: 5px; top: 50%; transform: translateY(-50%); }
    .dpad-right { right: 5px; top: 50%; transform: translateY(-50%); }

    .middle-nav {
      display: flex;
      justify-content: space-between;
      width: 100%;
    }

    .nav-btn {
      padding: 12px 20px;
      background: var(--btn-bg);
      border: none;
      border-radius: 14px;
      color: var(--text-muted);
      font-size: 14px;
      cursor: pointer;
    }

    .control-row {
      display: flex;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }

    .control-box {
      flex: 1;
      background: var(--btn-bg);
      border-radius: 16px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
    }

    .control-box span {
      font-size: 11px;
      color: var(--text-muted);
      font-weight: bold;
    }

    .mini-btn {
      width: 35px;
      height: 35px;
      background: #1a1d28;
      border: none;
      border-radius: 50%;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 65px;
      background-color: var(--remote-bg);
      display: flex;
      justify-content: space-around;
      align-items: center;
      border-top: 1px solid #2a2e3d;
      z-index: 1000;
    }

    .bottom-nav button {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      opacity: 0.5;
      padding: 10px;
    }

    .bottom-nav button.active {
      opacity: 1;
      filter: drop-shadow(0 0 6px var(--primary));
    }

    .settings-card {
      background: var(--remote-bg);
      width: 100%;
      max-width: 400px;
      border-radius: 20px;
      padding: 25px;
      border: 1px solid rgba(255,255,255,0.05);
    }

    .scan-submit-btn {
      width: 100%;
      padding: 15px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 14px;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      box-shadow: 0 0 15px var(--accent-glow);
      margin-top: 15px;
    }

    .reset-btn {
      width: 100%;
      padding: 10px;
      background: transparent;
      color: var(--text-muted);
      border: 1px solid #2a2e3d;
      border-radius: 14px;
      font-size: 13px;
      cursor: pointer;
      margin-top: 10px;
    }

    .device-list {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 250px;
      overflow-y: auto;
    }

    .device-card {
      background: var(--bg-color);
      padding: 15px;
      border-radius: 14px;
      border: 1px solid #2a2e3d;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>
<body>

  <div class="app-container" id="app"></div>

  <script>
    let activeTab = 'remote';
    let selectedTv = localStorage.getItem('tv_name') || 'Ningún televisor vinculado';
    let discoveredDevices = [];
    let isScanning = false;
    let scanStatusMsg = 'Presiona el botón para buscar tu Smart TV en la red Wi-Fi.';

    function render() {
      const app = document.getElementById('app');
      let content = '';

      if (activeTab === 'remote') {
        content = `
          <div class="screen">
            <div class="remote-card">
              <button class="power-btn" onclick="sendCommand('POWER')">
                <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
                  <path d="M18.36 6.64a9 9 0 1 1-12.73 0"></path>
                  <line x1="12" y1="2" x2="12" y2="12"></line>
                </svg>
              </button>
              
              <div style="text-align: center; margin: 5px 0;">
                <p style="font-size: 12px; color: var(--text-muted);">Dispositivo actual:</p>
                <p style="font-size: 14px; font-weight: bold; color: var(--text-color); cursor: pointer;" onclick="activeTab='settings'; render();">📺 ${selectedTv} ⚙️</p>
              </div>

              <div class="top-actions">
                <button class="action-pill" onclick="sendCommand('TV')">TV</button>
                <button class="action-pill" onclick="sendCommand('HOME')">Home</button>
                <button class="action-pill" onclick="sendCommand('APPS')">Apps</button>
              </div>

              <div class="dpad-container">
                <button class="dpad-btn dpad-up" onclick="sendCommand('UP')">▲</button>
                <button class="dpad-btn dpad-left" onclick="sendCommand('LEFT')">◀</button>
                <button class="ok-btn" onclick="sendCommand('OK')">OK</button>
                <button class="dpad-btn dpad-right" onclick="sendCommand('RIGHT')">▶</button>
                <button class="dpad-btn dpad-down" onclick="sendCommand('DOWN')">▼</button>
              </div>

              <div class="middle-nav">
                <button class="nav-btn" onclick="sendCommand('BACK')">← Atrás</button>
                <button class="nav-btn" onclick="sendCommand('EXIT')">EXIT ✕</button>
              </div>

              <div class="control-row">
                <div class="control-box">
                  <span>VOL</span>
                  <button class="mini-btn" onclick="sendCommand('VOL+')">+</button>
                  <button class="mini-btn" onclick="sendCommand('VOL-')">-</button>
                </div>
                <div class="control-box">
                  <button class="mini-btn" style="margin-bottom:2px;" onclick="sendCommand('MENU')">☰</button>
                  <button class="mini-btn" style="background:var(--primary);" onclick="sendCommand('MUTE')">🔇</button>
                </div>
                <div class="control-box">
                  <span>CH</span>
                  <button class="mini-btn" onclick="sendCommand('CH+')">+</button>
                  <button class="mini-btn" onclick="sendCommand('CH-')">-</button>
                </div>
              </div>
            </div>
          </div>
        `;
      } else if (activeTab === 'numberpad') {
        content = `
          <div class="screen">
            <div class="remote-card" style="padding-bottom: 30px; justify-content: center;">
              <p style="font-size: 14px; color: var(--text-muted); margin-bottom: 15px; text-align: center;">Teclado Numérico Directo</p>
              <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 15px; width: 100%; max-width: 320px;">
                ${[1,2,3,4,5,6,7,8,9].map(n => `<button style="padding: 18px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 20px; font-weight: bold; cursor: pointer;" onclick="sendCommand('${n}')">${n}</button>`).join('')}
                <button style="padding: 18px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 18px; cursor: pointer;" onclick="sendCommand('BACKSPACE')">⌫</button>
                <button style="padding: 18px; background: var(--btn-bg); border: none; border-radius: 50%; color: white; font-size: 20px; font-weight: bold; cursor: pointer;" onclick="sendCommand('0')">0</button>
                <button style="padding: 18px; background: #2ed573; border: none; border-radius: 50%; color: white; font-size: 16px; font-weight: bold; cursor: pointer;" onclick="sendCommand('ENTER')">OK</button>
              </div>
            </div>
          </div>
        `;
      } else if (activeTab === 'settings') {
        content = `
          <div class="screen">
            <div class="settings-card">
              <h2 style="margin-bottom: 10px;">Buscar Smart TV</h2>
              <p style="color: var(--text-muted); font-size: 13px; line-height: 1.5;">Búsqueda automática de dispositivos reales en tu red local.</p>
              
              <button class="scan-submit-btn" onclick="startAutoDiscovery()">
                ${isScanning ? 'Buscando dispositivos...' : 'Escanear Red Wi-Fi'}
              </button>

              <button class="reset-btn" onclick="resetStoredTv()">
                Olvidar dispositivo actual
              </button>

              <div class="device-list">
                ${discoveredDevices.length === 0 ? `<p style="text-align:center; color:var(--text-muted); font-size:13px; margin-top:20px;">${scanStatusMsg}</p>` : discoveredDevices.map(d => `
                  <div class="device-card" onclick="pairWithDevice('${d.name}', '${d.ip}')">
                    <div>
                      <strong>📺 ${d.name}</strong>
                      <div style="font-size: 12px; color: var(--text-muted);">${d.ip}</div>
                    </div>
                    <span style="color: var(--primary); font-weight: bold;">Conectar</span>
                  </div>
                `).join('')}
              </div>
            </div>
          </div>
        `;
      }

      app.innerHTML = `
        ${content}
        <nav class="bottom-nav">
          <button class="${activeTab === 'remote' ? 'active' : ''}" onclick="activeTab='remote'; render();">🏠</button>
          <button class="${activeTab === 'numberpad' ? 'active' : ''}" onclick="activeTab='numberpad'; render();">🔢</button>
          <button class="${activeTab === 'settings' ? 'active' : ''}" onclick="activeTab='settings'; render();">⚙️</button>
        </nav>
      `;
    }

    function startAutoDiscovery() {
      if (isScanning) return;
      isScanning = true;
      discoveredDevices = [];
      scanStatusMsg = 'Buscando Smart TVs en la red...';
      render();

      const zeroconf = window.cordova && window.cordova.plugins && window.cordova.plugins.zeroconf;

      if (!zeroconf) {
        isScanning = false;
        scanStatusMsg = 'Error: El módulo mDNS no está disponible.';
        render();
        return;
      }

      // Escuchamos servicios de Google TV / Android TV
      const servicesToWatch = [
        '_androidtvremote2._tcp.',
        '_googlecast._tcp.'
      ];

      servicesToWatch.forEach(type => {
        zeroconf.watch(type, 'local.', function(result) {
          if (result.action === 'resolved' && result.service) {
            const srv = result.service;
            const ipv4 = srv.ipv4Addresses && srv.ipv4Addresses.find(ip => ip.startsWith('192.') || ip.startsWith('10.') || ip.startsWith('172.'));
            
            if (ipv4) {
              const tvName = (srv.txtRecord && srv.txtRecord.fn) || srv.name || 'Smart TV';

              if (!discoveredDevices.some(d => d.ip === ipv4)) {
                discoveredDevices.push({
                  name: tvName,
                  ip: ipv4
                });
                render();
              }
            }
          }
        }, function(err) {
          console.error('Error mDNS:', err);
        });
      });

      setTimeout(() => {
        servicesToWatch.forEach(type => {
          try { zeroconf.unwatch(type, 'local.'); } catch(e) {}
        });
        isScanning = false;
        if (discoveredDevices.length === 0) {
          scanStatusMsg = 'No se encontró ningún Smart TV. Asegúrate de que el televisor esté encendido y conectado al mismo Wi-Fi.';
        }
        render();
      }, 8000);
    }

    function pairWithDevice(name, ip) {
      const pin = prompt(`Para vincular con "${name}" (${ip}), ingresa el PIN que aparece en la pantalla de tu televisor:`);
      if (pin) {
        selectedTv = `${name} (${ip})`;
        localStorage.setItem('tv_name', selectedTv);
        localStorage.setItem('tv_ip', ip);
        alert(`¡Conectado exitosamente a ${name}!`);
        activeTab = 'remote';
        render();
      }
    }

    function resetStoredTv() {
      localStorage.removeItem('tv_name');
      localStorage.removeItem('tv_ip');
      selectedTv = 'Ningún televisor vinculado';
      discoveredDevices = [];
      alert('Se ha borrado el televisor guardado.');
      render();
    }

    function sendCommand(cmd) {
      const ip = localStorage.getItem('tv_ip');
      if (!ip) {
        alert('Por favor, selecciona tu televisor primero desde el menú de Ajustes (⚙️).');
        activeTab = 'settings';
        render();
        return;
      }
      console.log(`Enviando comando ${cmd} al TV ${ip}`);
    }

    window.onload = () => render();
  </script>
</body>
</html>
